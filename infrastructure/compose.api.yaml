name: sentinel-api
services:
  api-db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${SENTINEL_DB_NAME:-sentinel_api}
      POSTGRES_USER: sentinel_api
      POSTGRES_PASSWORD: ${SENTINEL_POSTGRES_PASSWORD:?Use scripts/api-local.py}
    ports:
      - "127.0.0.1:${SENTINEL_DB_PORT:-55434}:5432"
    volumes:
      - api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_api -d sentinel_api"]
      interval: 2s
      timeout: 3s
      retries: 20
  api-redis:
    image: redis:8.2.10-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    user: redis
    environment:
      REDISCLI_AUTH: ${SENTINEL_REDIS_PASSWORD:?Use scripts/api-local.py}
    command:
      - sh
      - -c
      - "umask 077; printf 'requirepass %s\nappendonly yes\nappendfsync everysec\nmaxmemory-policy noeviction\n' \"$$REDISCLI_AUTH\" > /data/redis.conf; exec redis-server /data/redis.conf"
    ports:
      - "127.0.0.1:${SENTINEL_REDIS_PORT:-56379}:6379"
    volumes:
      - api-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  api-postgres-data:
  api-redis-data:
