name: sentinel-observability
services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      [
        --config.file=/etc/prometheus/prometheus.yaml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=24h,
        --storage.tsdb.retention.size=256MB,
      ]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: [-config.file=/etc/loki/config.yaml]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ../.artifacts/observability/logs:/logs:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki]
    mem_limit: 256m
    cpus: 1
    security_opt: [no-new-privileges:true]
  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: [-config.file=/etc/tempo/config.yaml]
    ports: ["127.0.0.1:3200:3200", "127.0.0.1:4418:4318"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      [
        --config.file=/etc/alertmanager/config.yaml,
        --storage.path=/alertmanager,
        --data.retention=24h,
        --cluster.listen-address=,
      ]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/config.yaml:ro
      - ../.artifacts/observability/secrets/webhook-token:/run/secrets/webhook-token:ro
      - alertmanager-data:/alertmanager
    mem_limit: 128m
    cpus: 1
    security_opt: [no-new-privileges:true]
volumes:
  alertmanager-data:
  tempo-data:
  loki-data:
  alloy-data:
  prometheus-data:
